# Keeps the testnet demo world moving without anyone's laptop: one bot tick every 30 minutes.
# Needs the repository secret BOT_KEYS = the contents of sandbox/.keys/testnet.json (written by sandbox/deploy-testnet.mjs).
# Honest limit: GitHub's scheduler can run late by many minutes, so this keeps coins checked in, trading and burning, but it is
# too slow to answer a judge's raid or card in the short demo-mode windows. For that, run the bots on an always-on machine
# (see docs/deploy.md: Dockerfile.bots).
name: Bots
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: bots
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: One bot tick
        env:
          BOT_KEYS: ${{ secrets.BOT_KEYS }}
        run: |
          if [ -z "$BOT_KEYS" ]; then echo "Secret BOT_KEYS is not set: nothing to do."; exit 0; fi
          mkdir -p sandbox/.keys
          printf '%s' "$BOT_KEYS" > sandbox/.keys/testnet.json
          RULECARD_KEYS=sandbox/.keys/testnet.json node sandbox/bots.mjs --mode demo --ticks 1 --per-coin 3
