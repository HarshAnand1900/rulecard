[package]
name = "rulecard-coin"
version = "0.2.0"
edition = "2021"
description = "Rulecard coin: one NEP-141 memecoin with its own curve, pot, Vault, idle burn, Daily Ritual and cards. No admin."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[features]
demo = []
