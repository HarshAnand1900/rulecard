[package]
name = "rulecard-factory"
version = "0.2.0"
edition = "2021"
description = "Rulecard factory: launches one coin contract per memecoin from a fixed global contract hash. No admin."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[features]
demo = []
