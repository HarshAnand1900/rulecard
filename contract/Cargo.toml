[package]
name = "rulecard"
version = "0.1.0"
edition = "2021"
description = "Rulecard: memecoin launchpad with rule cards, on NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
